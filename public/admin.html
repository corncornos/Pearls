<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearls Water — Admin</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { deep: '#0A1428', ocean: '#0c2340', turquoise: '#00D4FF' } } } };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background:#0c2340; }
  .card { background:#0f2a4a; border:1px solid rgba(255,255,255,0.08); }
  input, textarea, select { background:#0A1428; border:1px solid rgba(255,255,255,0.15); color:#fff; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#00D4FF; }
  .drag-handle { cursor: grab; touch-action: none; }
  .drag-handle:active { cursor: grabbing; }
  .product-row.dragging { opacity: 0.4; }
  .product-row.drag-over-top { border-top: 2px solid #00D4FF; }
  .product-row.drag-over-bottom { border-bottom: 2px solid #00D4FF; }
  .dropzone { transition: border-color 0.15s, background-color 0.15s; }
  .dropzone.drag-over { border-color: #00D4FF; background: rgba(0,212,255,0.08); }
  .admin-tab { transition: all 0.15s; }
  .admin-tab.active { background:#00D4FF; color:#0A1428; }
  .admin-tab:not(.active) { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.6); }
  input[type="color"] { padding:2px; height:44px; cursor:pointer; }
</style>
</head>
<body class="min-h-screen text-white">

  <!-- LOGIN VIEW -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="card rounded-2xl p-8 w-full max-w-sm">
      <h1 class="text-xl font-bold mb-1">Admin</h1>
      <p class="text-white/50 text-sm mb-6">Pearls Water — internal use only</p>
      <input id="password-input" type="password" placeholder="Admin password" class="w-full rounded-lg px-4 py-3 mb-3" />
      <button id="login-btn" class="w-full bg-turquoise text-deep font-bold rounded-lg py-3 hover:opacity-90 transition">Log In</button>
      <p id="login-error" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="editor-view" class="hidden max-w-6xl mx-auto p-4 sm:p-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-bold">Admin</h1>
        <p class="text-white/50 text-sm">Edits save straight to the live site.</p>
      </div>
      <button id="logout-btn" class="bg-white/5 hover:bg-white/10 rounded-lg px-4 py-2 text-sm transition">Log Out</button>
    </div>

    <!-- Section Tabs -->
    <div class="flex gap-2 mb-6">
      <button id="tab-catalog-btn" class="admin-tab active rounded-full px-5 py-2 text-sm font-bold transition">Catalog</button>

    <!-- CATALOG PANEL -->

    </div>

    <!-- DESIGN PANEL -->

        <button id="save-design-btn" class="bg-turquoise text-deep font-bold rounded-lg px-5 py-2 text-sm hover:opacity-90 transition">Save Site Design</button>
      </div>

            <div><label class="text-xs text-white/50">Ocean</label><input id="cfg-color-ocean" type="color" class="w-full rounded-lg mt-1"></div>

            <div><label class="text-xs text-white/50">Accent</label><input id="cfg-color-accent" type="color" class="w-full rounded-lg mt-1"></div>

            </div>

              <div><label class="text-xs text-white/50">Phone 1</label><input id="cfg-footer-phone1" type="text" class="w-full rounded-lg px-3 py-2 mt-1"></div>
              <div><label class="text-xs text-white/50">Phone 2</label><input id="cfg-footer-phone2" type="text" class="w-full rounded-lg px-3 py-2 mt-1"></div>

<script>
const CATEGORIES = ["Purified Water Systems", "Mineral & High pH", "Consumables", "Services", "Water Related Products"];
const SUBCATEGORIES = ["Wall Hung Filters", "Sediment Filters", "Carbon Block", "UV Sterilizer", "Elements", "Heads", "FRP Tanks", "RO Membrane", "Filter Cartridge", "Accessories"];

// Bundled fallback so the very first save has something sensible to start from.
// Kept in sync with /catalog-defaults.js (single source of truth) - loaded below
// as a script include so this file no longer carries its own stale duplicate.
</script>
<script src="/catalog-defaults.js"></script>
<script src="/site-config-defaults.js"></script>
<script>

let products = [];
let siteConfig = null;
const listEl = document.getElementById('product-list');
const statusEl = document.getElementById('status-msg');

function showStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = 'mb-4 text-sm ' + (isError ? 'text-red-400' : 'text-turquoise');
  statusEl.classList.remove('hidden');
  setTimeout(() => statusEl.classList.add('hidden'), isError ? 15000 : 4000);
}

// ---- Tab switching ----
function showTab(tab) {
  const isCatalog = tab === 'catalog';
  document.getElementById('panel-catalog').classList.toggle('hidden', !isCatalog);
  document.getElementById('panel-design').classList.toggle('hidden', isCatalog);
  document.getElementById('tab-catalog-btn').classList.toggle('active', isCatalog);
  document.getElementById('tab-design-btn').classList.toggle('active', !isCatalog);
}
document.getElementById('tab-catalog-btn').addEventListener('click', () => showTab('catalog'));
document.getElementById('tab-design-btn').addEventListener('click', () => showTab('design'));

// ---- Catalog logic (unchanged behavior) ----
function nextId() {
  return products.reduce((max, p) => Math.max(max, Number(p.id) || 0), 0) + 1;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}
function thumbsMarkup(idx) {
  const p = products[idx];
  return (p.images || []).filter(Boolean).map((img, imgIdx) => `
    <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-white/15 group">
      <img src="${escapeAttr(img)}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1544485547-5d1e67c87c7e?auto=format&fit=crop&q=80&w=200'">
      <button type="button" data-remove-img="${idx}:${imgIdx}" title="Remove image" class="absolute top-0 right-0 bg-black/70 text-white text-xs w-5 h-5 flex items-center justify-center rounded-bl-lg opacity-0 group-hover:opacity-100 transition">&times;</button>
    </div>
  `).join('');
}

function render() {
  listEl.innerHTML = '';
  products.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'product-row card rounded-xl p-4';
    row.draggable = true;
    row.dataset.idx = idx;
    row.innerHTML = `
      <div class="flex items-start gap-2 mb-3">
        <span class="drag-handle text-white/30 hover:text-white/70 text-lg leading-none select-none pt-1" title="Drag to reorder">&#9776;</span>
        <span class="text-xs text-white/40 pt-1">#${idx + 1}</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-white/50">Name</label>
          <input data-field="name" data-idx="${idx}" value="${escapeAttr(p.name || '')}" class="w-full rounded-lg px-3 py-2 mt-1" />
        </div>
        <div>
          <label class="text-xs text-white/50">Price</label>
          <input data-field="price" data-idx="${idx}" value="${escapeAttr(p.price || '')}" class="w-full rounded-lg px-3 py-2 mt-1" />
        </div>
        <div>
          <label class="text-xs text-white/50">Category</label>
          <select data-field="category" data-idx="${idx}" class="w-full rounded-lg px-3 py-2 mt-1">
            ${CATEGORIES.map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="${p.category === 'Consumables' ? '' : 'hidden'}" data-subcat-wrap="${idx}">
          <label class="text-xs text-white/50">Sub-category</label>
          <select data-field="subCategory" data-idx="${idx}" class="w-full rounded-lg px-3 py-2 mt-1">
            ${SUBCATEGORIES.map(s => `<option value="${s}" ${p.subCategory === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="text-xs text-white/50">Description</label>
          <textarea data-field="desc" data-idx="${idx}" rows="2" class="w-full rounded-lg px-3 py-2 mt-1">${escapeHtml(p.desc || '')}</textarea>
        </div>
        <div class="md:col-span-2">
          <label class="text-xs text-white/50">Images</label>
          <div class="flex flex-wrap gap-2 mt-1 mb-2" data-thumbs="${idx}">${thumbsMarkup(idx)}</div>
          <div data-dropzone="${idx}" class="dropzone rounded-lg px-3 py-4 text-center text-sm text-white/50 cursor-pointer border-2 border-dashed border-white/15 hover:border-turquoise">
            Drag &amp; drop images here, or click to browse
          </div>
          <input type="file" data-fileinput="${idx}" accept="image/*" multiple class="hidden" />
          <p class="text-[11px] mt-1 min-h-[1em]" data-upload-status="${idx}"></p>
          <details class="mt-2">
            <summary class="text-xs text-white/40 cursor-pointer">Or paste image URLs (comma-separated)</summary>
            <input data-field="images" data-idx="${idx}" value="${escapeAttr((p.images || []).join(', '))}" class="w-full rounded-lg px-3 py-2 mt-2" />
          </details>
        </div>
      </div>
      <div class="flex justify-end mt-3">
        <button data-remove="${idx}" class="text-red-400 hover:text-red-300 text-sm font-semibold">Delete Product</button>
      </div>
    `;
    listEl.appendChild(row);
  });

  listEl.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('input', onFieldChange);
    el.addEventListener('change', onFieldChange);
  });
  listEl.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.remove);
      products.splice(idx, 1);
      render();
    });
  });

  attachDragHandlers();
  attachImageUploadHandlers();
}

let dragSrcIdx = null;

function attachDragHandlers() {
  const rows = listEl.querySelectorAll('.product-row');
  rows.forEach(row => {
    row.addEventListener('dragstart', (e) => {
      dragSrcIdx = Number(row.dataset.idx);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragSrcIdx));
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      rows.forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
      dragSrcIdx = null;
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const targetIdx = Number(row.dataset.idx);
      if (targetIdx === dragSrcIdx) return;
      const rect = row.getBoundingClientRect();
      const isAfter = (e.clientY - rect.top) > rect.height / 2;
      row.classList.toggle('drag-over-bottom', isAfter);
      row.classList.toggle('drag-over-top', !isAfter);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over-top', 'drag-over-bottom');
      const targetIdx = Number(row.dataset.idx);
      if (dragSrcIdx === null || targetIdx === dragSrcIdx) return;
      const rect = row.getBoundingClientRect();
      const isAfter = (e.clientY - rect.top) > rect.height / 2;
      let insertAt = isAfter ? targetIdx + 1 : targetIdx;
      const [moved] = products.splice(dragSrcIdx, 1);
      if (dragSrcIdx < insertAt) insertAt -= 1;
      products.splice(insertAt, 0, moved);
      render();
    });
  });
}

const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;

function updateImagesUI(idx) {
  const thumbs = listEl.querySelector(`[data-thumbs="${idx}"]`);
  if (thumbs) {
    thumbs.innerHTML = thumbsMarkup(idx);
    thumbs.querySelectorAll('[data-remove-img]').forEach(btn => {
      btn.addEventListener('click', onRemoveImageClick);
    });
  }
  const textInput = listEl.querySelector(`input[data-field="images"][data-idx="${idx}"]`);
  if (textInput) textInput.value = (products[idx].images || []).join(', ');
}

function onRemoveImageClick(e) {
  const [idx, imgIdx] = e.currentTarget.dataset.removeImg.split(':').map(Number);
  products[idx].images.splice(imgIdx, 1);
  updateImagesUI(idx);
}

async function uploadFiles(idx, fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  const statusElLocal = listEl.querySelector(`[data-upload-status="${idx}"]`);
  if (files.length === 0) {
    if (statusElLocal) {
      statusElLocal.textContent = 'Only image files are supported.';
      statusElLocal.className = 'text-[11px] mt-1 min-h-[1em] text-red-400';
    }
    return;
  }
  for (const file of files) {
    if (file.size > MAX_UPLOAD_BYTES) {
      if (statusElLocal) {
        statusElLocal.textContent = `${file.name} is too large (max ${MAX_UPLOAD_BYTES / (1024 * 1024)}MB).`;
        statusElLocal.className = 'text-[11px] mt-1 min-h-[1em] text-red-400';
      }
      continue;
    }
    if (statusElLocal) {
      statusElLocal.textContent = `Uploading ${file.name}...`;
      statusElLocal.className = 'text-[11px] mt-1 min-h-[1em] text-white/50';
    }
    try {
      const res = await fetch(`/api/upload-image?filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: { 'Content-Type': file.type || 'application/octet-stream' },
        body: file,
      });
      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error(`Server returned a non-JSON response (status ${res.status}).`);
      }
      if (!res.ok) throw new Error(data.error || `Upload failed (status ${res.status})`);

      products[idx].images = [...(products[idx].images || []), data.url];
      updateImagesUI(idx);
      if (statusElLocal) {
        statusElLocal.textContent = `Uploaded ${file.name}`;
        statusElLocal.className = 'text-[11px] mt-1 min-h-[1em] text-turquoise';
      }
    } catch (err) {
      if (statusElLocal) {
        statusElLocal.textContent = String(err.message || err);
        statusElLocal.className = 'text-[11px] mt-1 min-h-[1em] text-red-400';
      }
      console.error('Image upload failed:', err);
    }
  }
  setTimeout(() => {
    if (statusElLocal) statusElLocal.textContent = '';
  }, 4000);
}

function attachImageUploadHandlers() {
  listEl.querySelectorAll('[data-dropzone]').forEach(zone => {
    const idx = Number(zone.dataset.dropzone);
    const fileInput = listEl.querySelector(`[data-fileinput="${idx}"]`);
    zone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFiles(idx, fileInput.files);
      fileInput.value = '';
    });
    ['dragenter', 'dragover'].forEach(evt => {
      zone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      zone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove('drag-over');
      });
    });
    zone.addEventListener('drop', (e) => {
      const dtFiles = e.dataTransfer && e.dataTransfer.files;
      if (dtFiles && dtFiles.length) uploadFiles(idx, dtFiles);
    });
  });
  listEl.querySelectorAll('[data-remove-img]').forEach(btn => {
    btn.addEventListener('click', onRemoveImageClick);
  });
}

function onFieldChange(e) {
  const idx = Number(e.target.dataset.idx);
  const field = e.target.dataset.field;
  if (field === 'images') {
    products[idx].images = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
    updateImagesUI(idx);
  } else {
    products[idx][field] = e.target.value;
  }
  if (field === 'category') render();
}

document.getElementById('add-btn').addEventListener('click', () => {
  products.push({ id: nextId(), name: 'New Product', category: CATEGORIES[0], price: 'Ask for Price', desc: '', images: [] });
  render();
});

document.getElementById('save-btn').addEventListener('click', async () => {
  try {
    const res = await fetch('/api/products', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(products),
    });
    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      throw new Error(`Server returned a non-JSON response (status ${res.status}). Check Vercel function logs.`);
    }
    if (!res.ok) {
      const msg = [data.error, data.detail].filter(Boolean).join(' — ');
      throw new Error(msg || `Save failed (status ${res.status})`);
    }
    showStatus(`Saved ${data.count} products. Live site will pick these up on next page load.`);
  } catch (err) {
    showStatus(String(err.message || err), true);
    console.error('Save failed:', err);
  }
});

// ---- Design (site-config) logic ----
function fillDesignForm(cfg) {
  document.getElementById('cfg-color-deep').value = cfg.colors?.deep || '#123A66';
  document.getElementById('cfg-color-ocean').value = cfg.colors?.ocean || '#1C6FB5';
  document.getElementById('cfg-color-turquoise').value = cfg.colors?.turquoise || '#00D4FF';
  document.getElementById('cfg-color-accent').value = cfg.colors?.accent || '#2E86DE';

  document.getElementById('cfg-font-heading').value = cfg.fonts?.heading || "'Montserrat', sans-serif";
  document.getElementById('cfg-font-body').value = cfg.fonts?.body || "'Inter', sans-serif";

  document.getElementById('cfg-logo-size').value = cfg.logo?.size ?? 235;
  document.getElementById('cfg-logo-top').value = cfg.logo?.top ?? -30;
  document.getElementById('cfg-logo-left').value = cfg.logo?.left ?? 44;

  document.getElementById('cfg-hero-line1').value = cfg.hero?.line1 || '';
  document.getElementById('cfg-hero-line2').value = cfg.hero?.line2 || '';
  document.getElementById('cfg-hero-subtext').value = cfg.hero?.subtext || '';
  document.getElementById('cfg-hero-primary').value = cfg.hero?.primaryBtnLabel || '';
  document.getElementById('cfg-hero-secondary').value = cfg.hero?.secondaryBtnLabel || '';
  document.getElementById('cfg-hero-titlemax').value = cfg.hero?.titleMaxSize ?? 110;
  document.getElementById('cfg-hero-bgimage').value = cfg.hero?.bgImage || '';

  document.getElementById('cfg-section-packages').checked = cfg.sections?.packages !== false;
  document.getElementById('cfg-section-whyus').checked = cfg.sections?.whyUs !== false;
  document.getElementById('cfg-section-testimonials').checked = cfg.sections?.testimonials !== false;
  document.getElementById('cfg-section-opportunity').checked = cfg.sections?.opportunity !== false;

  document.getElementById('cfg-footer-tagline').value = cfg.footer?.tagline || '';
  document.getElementById('cfg-footer-address').value = cfg.footer?.address || '';
  document.getElementById('cfg-footer-email').value = cfg.footer?.email || '';
  document.getElementById('cfg-footer-phone1').value = cfg.footer?.phone1 || '';
  document.getElementById('cfg-footer-phone2').value = cfg.footer?.phone2 || '';
}

function readDesignForm() {
  return {
    colors: {
      deep: document.getElementById('cfg-color-deep').value,
      ocean: document.getElementById('cfg-color-ocean').value,
      turquoise: document.getElementById('cfg-color-turquoise').value,
      accent: document.getElementById('cfg-color-accent').value,
    },
    fonts: {
      heading: document.getElementById('cfg-font-heading').value,
      body: document.getElementById('cfg-font-body').value,
    },
    logo: {
      size: Number(document.getElementById('cfg-logo-size').value) || 235,
      top: Number(document.getElementById('cfg-logo-top').value) || 0,
      left: Number(document.getElementById('cfg-logo-left').value) || 0,
    },
    hero: {
      line1: document.getElementById('cfg-hero-line1').value,
      line2: document.getElementById('cfg-hero-line2').value,
      subtext: document.getElementById('cfg-hero-subtext').value,
      primaryBtnLabel: document.getElementById('cfg-hero-primary').value,
      secondaryBtnLabel: document.getElementById('cfg-hero-secondary').value,
      titleMaxSize: Number(document.getElementById('cfg-hero-titlemax').value) || 110,
      bgImage: document.getElementById('cfg-hero-bgimage').value,
    },
    sections: {
      packages: document.getElementById('cfg-section-packages').checked,
      whyUs: document.getElementById('cfg-section-whyus').checked,
      testimonials: document.getElementById('cfg-section-testimonials').checked,
      opportunity: document.getElementById('cfg-section-opportunity').checked,
    },
    footer: {
      tagline: document.getElementById('cfg-footer-tagline').value,
      address: document.getElementById('cfg-footer-address').value,
      email: document.getElementById('cfg-footer-email').value,
      phone1: document.getElementById('cfg-footer-phone1').value,
      phone2: document.getElementById('cfg-footer-phone2').value,
    },
  };
}

document.getElementById('save-design-btn').addEventListener('click', async () => {
  try {
    const config = readDesignForm();
    const res = await fetch('/api/site-config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      throw new Error(`Server returned a non-JSON response (status ${res.status}). Check Vercel function logs.`);
    }
    if (!res.ok) {
      const msg = [data.error, data.detail].filter(Boolean).join(' — ');
      throw new Error(msg || `Save failed (status ${res.status})`);
    }
    showStatus('Saved site design. Live site will pick these up on next page load.');
  } catch (err) {
    showStatus(String(err.message || err), true);
    console.error('Design save failed:', err);
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
});

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

async function login() {
  const password = document.getElementById('password-input').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    await enterEditor();
  } catch (err) {
    errEl.textContent = String(err.message || err);
    errEl.classList.remove('hidden');
  }
}

async function enterEditor() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('editor-view').classList.remove('hidden');

  // Load catalog
  try {
    const res = await fetch('/api/products');
    const data = await res.json();
    products = (data.products && data.products.length) ? data.products : (window.DEFAULT_PRODUCTS || []).slice();
  } catch (err) {
    products = (window.DEFAULT_PRODUCTS || []).slice();
  }
  render();

  // Load site design config
  try {
    const res = await fetch('/api/site-config');
    const data = await res.json();
    siteConfig = (data && data.config) ? data.config : (window.DEFAULT_SITE_CONFIG || {});
  } catch (err) {
    siteConfig = window.DEFAULT_SITE_CONFIG || {};
  }
  fillDesignForm(siteConfig);
}

// If already logged in (cookie still valid), skip straight to the editor.
(async function checkExistingSession() {
  try {
    const res = await fetch('/api/check-session');
    const data = await res.json();
    if (data.authenticated) await enterEditor();
  } catch (err) {
    // ignore, show login form
  }
})();
</script>
